<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кідландія - Розклад</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background: #ffffff;
            font-family: "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", Arial, sans-serif;
            color: #101733;
            padding: 0;
            overflow-x: hidden;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: transparent;
            border-radius: 36px;
            padding: 16px 10px 30px;
            position: relative;
        }
        .cloud {
            position: absolute;
            opacity: .72;
            pointer-events: none;
        }
        .cloud-left {
            left: -10px;
            top: 140px;
            width: 76px;
            height: 39px;
            color: #fbf3cd;
        }
        .cloud-right {
            right: -6px;
            top: 130px;
            width: 82px;
            height: 42px;
            color: #e3f1fe;
        }
        .logo {
            position: relative;
            width: max-content;
            margin: 10px auto 20px;
            font-size: 38px;
            font-weight: 1000;
            letter-spacing: 1px;
            line-height: .9;
            text-transform: uppercase;
        }
        .logo span {
            display: inline-block;
            text-shadow: 0 2px 1px rgba(0, 0, 0, .06);
        }
        .star {
            position: absolute;
            left: 42px;
            top: -22px;
            width: 20px;
            height: 20px;
            color: #ffc542;
            filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .12));
        }
        
        /* ===== СТИЛИ ДЛЯ СТОРИС ===== */
        .stories-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            touch-action: none;
            flex-direction: column;
        }
        .stories-overlay.active {
            display: flex;
        }
        
        .stories-bg-green {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9, #a5d6a7, #81c784);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .stories-bg-green.active {
            opacity: 1;
        }
        
        .stories-bg-blue {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb, #90caf9, #64b5f6);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .stories-bg-blue.active {
            opacity: 1;
        }
        
        .story-circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 1;
        }
        .story-circle-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -80px;
        }
        .story-circle-2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            left: -60px;
        }
        .story-circle-3 {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .stories-bg-green .story-circle-1 {
            background: radial-gradient(circle, rgba(46, 135, 29, 0.12), transparent);
        }
        .stories-bg-green .story-circle-2 {
            background: radial-gradient(circle, rgba(107, 183, 47, 0.10), transparent);
        }
        .stories-bg-green .story-circle-3 {
            background: radial-gradient(circle, rgba(46, 135, 29, 0.06), transparent);
        }
        
        .stories-bg-blue .story-circle-1 {
            background: radial-gradient(circle, rgba(18, 121, 191, 0.12), transparent);
        }
        .stories-bg-blue .story-circle-2 {
            background: radial-gradient(circle, rgba(37, 138, 210, 0.10), transparent);
        }
        .stories-bg-blue .story-circle-3 {
            background: radial-gradient(circle, rgba(18, 121, 191, 0.06), transparent);
        }
        
        .story-slide {
            display: none;
            width: 100%;
            height: 100%;
            padding: 70px 30px 140px;
            color: #1a1a2e;
            text-align: center;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex: 1;
            z-index: 2;
        }
        .story-slide.active {
            display: flex;
        }
        
        .story-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .story-slide img {
            max-width: 85%;
            max-height: 50vh;
            border-radius: 20px;
            margin-bottom: 30px;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 3px solid rgba(255,255,255,0.5);
        }
        
        .story-slide .story-text {
            font-size: 26px;
            line-height: 1.5;
            font-weight: 700;
            max-width: 90%;
            word-wrap: break-word;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            padding: 16px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        .stories-bg-green.active ~ .story-slide .story-text {
            color: #1e4a0e;
            background: rgba(255,255,255,0.9);
        }
        
        .stories-bg-blue.active ~ .story-slide .story-text {
            color: #0a2a4a;
            background: rgba(255,255,255,0.9);
        }
        
        .story-slide .story-text.large {
            font-size: 32px;
        }
        
        .story-slide .story-text .highlight-green {
            background: linear-gradient(135deg, #2e871d, #6bb72f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .story-slide .story-text .highlight-blue {
            background: linear-gradient(135deg, #1279bf, #258ad2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .story-slide .story-text .highlight-gold {
            background: linear-gradient(135deg, #ffc542, #f06a2f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .story-slide .story-text .highlight-pink {
            background: linear-gradient(135deg, #e33b85, #8038bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .story-progress {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .story-progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
            overflow: hidden;
        }
        .story-progress-bar .fill {
            height: 100%;
            width: 0%;
            transition: none;
            border-radius: 4px;
        }
        
        .stories-bg-green.active ~ .story-progress .fill {
            background: #2e871d;
        }
        .stories-bg-green.active ~ .story-progress .done .fill {
            background: #2e871d;
        }
        
        .stories-bg-blue.active ~ .story-progress .fill {
            background: #1279bf;
        }
        .stories-bg-blue.active ~ .story-progress .done .fill {
            background: #1279bf;
        }
        
        .story-progress-bar.done .fill {
            width: 100% !important;
        }
        .story-progress-bar.active .fill {
            width: 100% !important;
        }
        
        .story-tap-area {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            z-index: 5;
        }
        .story-tap-left {
            left: 0;
        }
        .story-tap-right {
            right: 0;
        }
        
        .story-next-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 16px 44px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            min-width: 140px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .story-next-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .story-next-btn:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        .stories-bg-green.active ~ .story-next-btn {
            background: rgba(46, 135, 29, 0.7);
            border-color: rgba(46, 135, 29, 0.5);
        }
        .stories-bg-green.active ~ .story-next-btn:hover {
            background: rgba(46, 135, 29, 0.85);
        }
        .stories-bg-green.active ~ .story-next-btn.finish {
            background: linear-gradient(135deg, rgba(46, 135, 29, 0.8), rgba(107, 183, 47, 0.6));
            border-color: rgba(46, 135, 29, 0.5);
        }
        
        .stories-bg-blue.active ~ .story-next-btn {
            background: rgba(18, 121, 191, 0.7);
            border-color: rgba(18, 121, 191, 0.5);
        }
        .stories-bg-blue.active ~ .story-next-btn:hover {
            background: rgba(18, 121, 191, 0.85);
        }
        .stories-bg-blue.active ~ .story-next-btn.finish {
            background: linear-gradient(135deg, rgba(18, 121, 191, 0.8), rgba(37, 138, 210, 0.6));
            border-color: rgba(18, 121, 191, 0.5);
        }
        
        .story-next-btn.finish:hover {
            transform: translateX(-50%) scale(1.05);
        }
        
        .story-indicators {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .story-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .stories-bg-green.active ~ .story-indicators .story-dot {
            background: rgba(46, 135, 29, 0.25);
        }
        .stories-bg-green.active ~ .story-indicators .story-dot.active {
            background: #2e871d;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(46, 135, 29, 0.3);
        }
        .stories-bg-green.active ~ .story-indicators .story-dot.done {
            background: rgba(46, 135, 29, 0.6);
        }
        
        .stories-bg-blue.active ~ .story-indicators .story-dot {
            background: rgba(18, 121, 191, 0.25);
        }
        .stories-bg-blue.active ~ .story-indicators .story-dot.active {
            background: #1279bf;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(18, 121, 191, 0.3);
        }
        .stories-bg-blue.active ~ .story-indicators .story-dot.done {
            background: rgba(18, 121, 191, 0.6);
        }
        
        .story-counter {
            position: absolute;
            top: 22px;
            right: 22px;
            z-index: 10;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
        }
        .stories-bg-green.active ~ .story-counter {
            color: #1e4a0e;
            background: rgba(255,255,255,0.7);
        }
        .stories-bg-blue.active ~ .story-counter {
            color: #0a2a4a;
            background: rgba(255,255,255,0.7);
        }
        
        /* ===== СТИЛИ ДЛЯ РАСПИСАНИЯ ===== */
        .schedule-wrapper {
            display: none;
        }
        .schedule-wrapper.visible {
            display: block;
        }
        .panel {
            border: 1.5px solid;
            border-radius: 20px;
            padding: 16px 10px 16px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(35, 65, 104, .08);
        }
        .panel+.panel {
            margin-top: 12px;
        }
        .panel.active {
            background: #f5fadf;
            border-color: #e0ecad;
        }
        .panel.next {
            background: #edf7ff;
            border-color: #c8e4f7;
            padding: 16px 8px 16px;
        }
        
        /* Новая строка: время + заголовок в одну строку */
        .time-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 12px;
            gap: 10px;
        }
        .time-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 1000;
            line-height: 1;
        }
        .time-right {
            font-size: 16px;
            font-weight: 1000;
            letter-spacing: .2px;
            text-transform: uppercase;
            line-height: 1;
        }
        
        .active .time-left,
        .active .time-right {
            color: #2e871d;
        }
        .next .time-left,
        .next .time-right {
            color: #1279bf;
        }
        
        .clock {
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
        }
        
        .grid-stations {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
        }
        .grid-stations .wide {
            grid-column: 1 / -1;
        }
        .station {
            display: grid;
            place-items: center;
            min-width: 0;
            background: #ffffff;
            border: 1.5px solid rgba(183, 205, 141, .48);
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(35, 65, 104, .05);
            min-height: 100px;
            height: auto;
            padding: 8px 3px 9px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .station:active {
            transform: scale(0.95);
        }
        .station.wide {
            grid-column: 1 / -1;
            min-height: 70px;
            height: auto;
            display: flex;
            justify-content: flex-start;
            gap: 18px;
            padding: 8px 20px;
            border-color: rgba(174, 210, 235, .7);
        }
        .badge {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: 6px;
            font-size: 32px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .wide .badge {
            width: 56px;
            height: 56px;
            margin: 0;
            flex: 0 0 auto;
            font-size: 34px;
        }
        .badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .station-name {
            max-width: 100%;
            color: #101733;
            font-size: 10px;
            font-weight: 1000;
            line-height: 1.2;
            text-align: center;
            text-transform: uppercase;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: none;
            padding: 0 1px;
            width: 100%;
        }
        .station-name br {
            display: none;
        }
        .wide .station-name {
            color: #7a32bf;
            font-size: 17px;
            line-height: 1.2;
            text-align: left;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: none;
        }
        .station-time {
            display: block;
            margin-top: 6px;
            color: #7a32bf;
            font-size: 12px;
            font-weight: 1000;
        }
        .badge-default {
            background: #f0f0f0;
        }
        .badge-default-2 {
            background: #e8f0fe;
        }
        .badge-default-3 {
            background: #fce8e8;
        }
        .badge-default-4 {
            background: #e8fce8;
        }
        .loading-state {
            text-align: center;
            padding: 30px 15px;
            color: #a2a2a2;
            font-size: 16px;
            font-weight: 600;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 34px;
            height: 34px;
            border: 4px solid #e0ecad;
            border-top-color: #2e871d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .update-time {
            text-align: center;
            color: #a2a2a2;
            font-size: 10px;
            margin-top: 12px;
            opacity: 0.7;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 20px;
            position: relative;
        }
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 12px;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            border: none;
            font-size: 22px;
            cursor: pointer;
            display: grid;
            place-items: center;
            color: #333;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: rgba(0,0,0,0.2);
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 12px 6px 24px;
                border-radius: 24px;
            }
            .logo {
                font-size: 32px;
                margin: 8px auto 16px;
            }
            .star {
                left: 36px;
                top: -18px;
                width: 18px;
                height: 18px;
            }
            .time-left {
                font-size: 24px;
                gap: 8px;
            }
            .time-right {
                font-size: 14px;
            }
            .clock {
                width: 28px;
                height: 28px;
            }
            .time-row {
                margin: 0 0 10px;
                gap: 8px;
            }
            .panel {
                padding: 12px 6px 12px;
                border-radius: 16px;
            }
            .panel.next {
                padding: 12px 5px 12px;
            }
            .station {
                min-height: 85px;
                padding: 6px 2px 7px;
                border-radius: 12px;
            }
            .station-name {
                font-size: 9px;
            }
            .wide .station-name {
                font-size: 14px;
            }
            .badge {
                width: 50px;
                height: 50px;
                font-size: 26px;
                margin-bottom: 5px;
            }
            .wide .badge {
                width: 48px;
                height: 48px;
                font-size: 28px;
            }
            .station.wide {
                padding: 6px 14px;
                gap: 14px;
                min-height: 60px;
            }
            .grid-stations {
                gap: 4px;
            }
            .station-time {
                font-size: 11px;
                margin-top: 4px;
            }
            .story-slide {
                padding: 60px 20px 120px;
            }
            .story-slide .story-text {
                font-size: 20px;
                padding: 14px 20px;
            }
            .story-slide .story-text.large {
                font-size: 24px;
            }
            .story-slide img {
                max-height: 45vh;
                margin-bottom: 24px;
            }
            .story-next-btn {
                padding: 14px 32px;
                font-size: 16px;
                bottom: 30px;
                min-width: 110px;
            }
            .story-indicators {
                bottom: 90px;
                gap: 10px;
            }
            .story-dot {
                width: 8px;
                height: 8px;
            }
            .story-counter {
                font-size: 12px;
                padding: 4px 12px;
                top: 18px;
                right: 18px;
            }
            .story-progress {
                top: 12px;
                left: 12px;
                right: 12px;
                gap: 4px;
            }
            .story-circle-1 {
                width: 200px;
                height: 200px;
                top: -80px;
                right: -60px;
            }
            .story-circle-2 {
                width: 150px;
                height: 150px;
                bottom: -40px;
                left: -40px;
            }
            .story-circle-3 {
                width: 100px;
                height: 100px;
            }
        }
        @media (max-width: 380px) {
            .container {
                padding: 10px 4px 20px;
            }
            .logo {
                font-size: 28px;
                margin: 6px auto 14px;
            }
            .star {
                left: 32px;
                top: -16px;
                width: 16px;
                height: 16px;
            }
            .time-left {
                font-size: 20px;
                gap: 6px;
            }
            .time-right {
                font-size: 12px;
            }
            .clock {
                width: 24px;
                height: 24px;
            }
            .time-row {
                margin: 0 0 8px;
                gap: 6px;
            }
            .panel {
                padding: 10px 4px 10px;
                border-radius: 14px;
            }
            .panel.next {
                padding: 10px 4px 10px;
            }
            .station {
                min-height: 70px;
                padding: 5px 2px 6px;
                border-radius: 10px;
            }
            .station-name {
                font-size: 8px;
            }
            .wide .station-name {
                font-size: 12px;
            }
            .badge {
                width: 42px;
                height: 42px;
                font-size: 22px;
                margin-bottom: 4px;
            }
            .wide .badge {
                width: 40px;
                height: 40px;
                font-size: 24px;
            }
            .station.wide {
                padding: 5px 10px;
                gap: 10px;
                min-height: 50px;
            }
            .grid-stations {
                gap: 3px;
            }
            .station-time {
                font-size: 10px;
                margin-top: 3px;
            }
            .story-slide {
                padding: 50px 15px 100px;
            }
            .story-slide .story-text {
                font-size: 17px;
                padding: 12px 16px;
            }
            .story-slide .story-text.large {
                font-size: 20px;
            }
            .story-slide img {
                max-height: 38vh;
                margin-bottom: 18px;
            }
            .story-next-btn {
                padding: 12px 24px;
                font-size: 14px;
                bottom: 24px;
                min-width: 90px;
            }
            .story-indicators {
                bottom: 75px;
                gap: 8px;
            }
            .story-dot {
                width: 6px;
                height: 6px;
            }
            .story-counter {
                font-size: 11px;
                padding: 3px 10px;
            }
        }
        @media (max-width: 340px) {
            .story-slide .story-text {
                font-size: 15px;
                padding: 10px 14px;
            }
            .story-slide .story-text.large {
                font-size: 17px;
            }
            .story-next-btn {
                padding: 10px 20px;
                font-size: 12px;
                min-width: 70px;
            }
            .time-left {
                font-size: 17px;
                gap: 5px;
            }
            .time-right {
                font-size: 10px;
            }
            .clock {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="cloud cloud-left" viewBox="0 0 96 48" aria-hidden="true">
            <path fill="currentColor" d="M16 38h64c8 0 14-6 14-13s-6-13-14-13c-2 0-4 1-6 1C70 5 62 0 52 0 40 0 31 7 28 18c-3-2-7-3-11-3C8 15 1 22 1 31s7 7 15 7z"/>
        </svg>
        <svg class="cloud cloud-right" viewBox="0 0 96 48" aria-hidden="true">
            <path fill="currentColor" d="M16 38h64c8 0 14-6 14-13s-6-13-14-13c-2 0-4 1-6 1C70 5 62 0 52 0 40 0 31 7 28 18c-3-2-7-3-11-3C8 15 1 22 1 31s7 7 15 7z"/>
        </svg>

        <h1 class="logo" aria-label="Кідландія">
            <svg class="star" viewBox="0 0 32 32" aria-hidden="true">
                <path fill="currentColor" d="m16 1.8 4.2 8.7 9.5 1.4-6.9 6.7 1.7 9.5L16 23.6l-8.5 4.5 1.7-9.5-6.9-6.7 9.5-1.4L16 1.8z"/>
            </svg>
            <span style="color:#7b2fc0">К</span><span style="color:#f06a2f">і</span><span style="color:#6bb72f">д</span><span style="color:#ffc928">л</span><span style="color:#258ad2">а</span><span style="color:#e33b85">н</span><span style="color:#8038bd">д</span><span style="color:#eb3c73">і</span><span style="color:#50bec3">я</span>
        </h1>

        <div id="scheduleWrapper" class="schedule-wrapper">
            <div id="scheduleContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Завантаження розкладу...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Полноэкранные сторис -->
    <div class="stories-overlay" id="storiesOverlay">
        <div class="stories-bg-green" id="bgGreen">
            <div class="story-circle story-circle-1"></div>
            <div class="story-circle story-circle-2"></div>
            <div class="story-circle story-circle-3"></div>
        </div>
        <div class="stories-bg-blue" id="bgBlue">
            <div class="story-circle story-circle-1"></div>
            <div class="story-circle story-circle-2"></div>
            <div class="story-circle story-circle-3"></div>
        </div>
        
        <div class="story-progress" id="storyProgress"></div>
        <div class="story-counter" id="storyCounter">1/3</div>
        
        <div id="storySlides"></div>
        
        <div class="story-tap-area story-tap-left" id="storyTapLeft"></div>
        <div class="story-tap-area story-tap-right" id="storyTapRight"></div>
        
        <div class="story-indicators" id="storyIndicators"></div>
        
        <button class="story-next-btn" id="storyNextBtn">
            <span id="btnText">ДАЛІ</span>
        </button>
    </div>

    <!-- Модальное окно для карты -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <img id="mapImage" src="" alt="Карта станції">
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzeEhyXLvNNsXUCTiKTo4GSuuTj4NEmAXopQ0ztwk3HjqLB9BXTqYNuGVlEdNw6LJo-sA/exec';

        let storiesData = [];
        let currentStoryIndex = 0;
        let settingsData = { logos: {}, maps: {} };
        let isStoriesActive = false;
        let isStoryTransitioning = false;

        async function fetchData() {
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error(`Помилка: ${response.status}`);
                const data = await response.json();
                console.log('📦 Дані:', data);
                return data;
            } catch (err) {
                console.error('❌ Помилка:', err);
                return { success: false, error: err.message };
            }
        }

        function getKyivTime() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('uk-UA', {
                timeZone: 'Europe/Kiev',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            const timeStr = formatter.format(now);
            const parts = timeStr.split(':');
            const date = new Date();
            date.setHours(parseInt(parts[0]) || 0);
            date.setMinutes(parseInt(parts[1]) || 0);
            date.setSeconds(0);
            return date;
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return -1;
            const parts = timeStr.split(':');
            if (parts.length >= 2) {
                const hours = parseInt(parts[0]);
                const minutes = parseInt(parts[1]);
                if (!isNaN(hours) && !isNaN(minutes)) {
                    return hours * 60 + minutes;
                }
            }
            return -1;
        }

        function getStationStatus(timeFrom, timeTo, currentTime) {
            const from = parseTimeToMinutes(timeFrom);
            const to = parseTimeToMinutes(timeTo);
            const current = currentTime.getHours() * 60 + currentTime.getMinutes();

            if (from === -1 || to === -1) return 'unknown';

            if (to < from) {
                if (current >= from || current < to) return 'active';
                if (current < from) return 'future';
                return 'past';
            }

            if (current >= from && current < to) return 'active';
            if (current < from) return 'future';
            return 'past';
        }

        function getStationStyle(stationName) {
            const name = stationName.toUpperCase();
            const map = {
                'КАРАОКЕ': { emoji: '🎤', cls: 'mic' },
                'СТРОЙМАЙДАНЧИК': { emoji: '🧱', cls: 'build' },
                'ТЕАТР': { emoji: '🎭', cls: 'theatre' },
                'ДОСТАВКА СИЛЬПО': { emoji: '🛒', cls: 'silpo' },
                'СИЛЬПО': { emoji: '🛒', cls: 'silpo' },
                'TV-СТУДІЯ': { emoji: '📺', cls: 'tv' },
                'EVA': { emoji: '🛍️', cls: 'eva' },
                'ЕВА': { emoji: '🛍️', cls: 'eva' },
                'ТУРИСТИЧНЕ АГЕНСТВО': { emoji: '🌍🧳', cls: 'trip' },
                'ЛІТАК': { emoji: '✈️', cls: 'plane' },
                'ДР': { emoji: '🎂', cls: 'dr' }
            };

            for (const [key, value] of Object.entries(map)) {
                if (name === key) {
                    return value;
                }
            }

            const defaultClasses = ['badge-default', 'badge-default-2', 'badge-default-3', 'badge-default-4'];
            const hash = name.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return {
                emoji: name.charAt(0),
                cls: defaultClasses[hash % defaultClasses.length]
            };
        }

        // ========== СТОРИС ==========
        function renderStories(stories) {
            const overlay = document.getElementById('storiesOverlay');
            const slidesContainer = document.getElementById('storySlides');
            const progressContainer = document.getElementById('storyProgress');
            const indicatorsContainer = document.getElementById('storyIndicators');
            const counter = document.getElementById('storyCounter');

            if (!stories || stories.length === 0) {
                overlay.classList.remove('active');
                return;
            }

            storiesData = stories;
            overlay.classList.add('active');
            isStoriesActive = true;

            document.getElementById('scheduleWrapper').classList.remove('visible');

            slidesContainer.innerHTML = '';
            stories.forEach((story, index) => {
                const slide = document.createElement('div');
                slide.className = 'story-slide' + (index === 0 ? ' active' : '');
                slide.dataset.index = index;
                
                const content = document.createElement('div');
                content.className = 'story-content';
                
                if (story.image) {
                    const img = document.createElement('img');
                    img.src = story.image;
                    img.alt = 'Сторис';
                    img.loading = 'lazy';
                    content.appendChild(img);
                }
                
                if (story.text) {
                    const text = document.createElement('div');
                    text.className = 'story-text' + (story.text.length < 40 ? ' large' : '');
                    let formattedText = story.text;
                    const highlights = [
                        { find: /Кідландія/gi, replace: '<span class="highlight-gold">Кідландія</span>' },
                        { find: /Kidslandia/gi, replace: '<span class="highlight-gold">Kidslandia</span>' },
                        { find: /діти/gi, replace: '<span class="highlight-green">діти</span>' },
                        { find: /дітей/gi, replace: '<span class="highlight-green">дітей</span>' },
                        { find: /дитина/gi, replace: '<span class="highlight-green">дитина</span>' },
                        { find: /дитини/gi, replace: '<span class="highlight-green">дитини</span>' },
                        { find: /свято/gi, replace: '<span class="highlight-pink">свято</span>' },
                        { find: /розваги/gi, replace: '<span class="highlight-blue">розваги</span>' },
                        { find: /веселощі/gi, replace: '<span class="highlight-gold">веселощі</span>' }
                    ];
                    highlights.forEach(h => {
                        formattedText = formattedText.replace(h.find, h.replace);
                    });
                    text.innerHTML = formattedText;
                    content.appendChild(text);
                }
                
                slide.appendChild(content);
                slidesContainer.appendChild(slide);
            });

            progressContainer.innerHTML = '';
            stories.forEach((_, index) => {
                const bar = document.createElement('div');
                bar.className = 'story-progress-bar';
                bar.innerHTML = '<div class="fill"></div>';
                progressContainer.appendChild(bar);
            });

            indicatorsContainer.innerHTML = '';
            stories.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = 'story-dot';
                indicatorsContainer.appendChild(dot);
            });

            counter.textContent = `1/${stories.length}`;

            currentStoryIndex = 0;
            updateStoryUI(0);
            updateButtonText();
        }

        function updateStoryUI(index) {
            const slides = document.querySelectorAll('.story-slide');
            const bars = document.querySelectorAll('.story-progress-bar');
            const dots = document.querySelectorAll('.story-dot');
            const counter = document.getElementById('storyCounter');
            
            const bgGreen = document.getElementById('bgGreen');
            const bgBlue = document.getElementById('bgBlue');
            
            if (index % 2 === 0) {
                bgGreen.classList.add('active');
                bgBlue.classList.remove('active');
            } else {
                bgBlue.classList.add('active');
                bgGreen.classList.remove('active');
            }

            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });

            bars.forEach((bar, i) => {
                bar.classList.remove('active', 'done');
                const fill = bar.querySelector('.fill');
                if (i < index) {
                    bar.classList.add('done');
                    fill.style.width = '100%';
                } else if (i === index) {
                    bar.classList.add('active');
                    fill.style.width = '100%';
                } else {
                    fill.style.width = '0%';
                }
            });

            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'done');
                if (i < index) dot.classList.add('done');
                else if (i === index) dot.classList.add('active');
            });

            counter.textContent = `${index + 1}/${storiesData.length}`;
            currentStoryIndex = index;
            updateButtonText();
        }

        function updateButtonText() {
            const btn = document.getElementById('storyNextBtn');
            const btnText = document.getElementById('btnText');
            if (currentStoryIndex === storiesData.length - 1) {
                btnText.textContent = 'ДО РОЗКЛАДУ';
                btn.classList.add('finish');
            } else {
                btnText.textContent = 'ДАЛІ';
                btn.classList.remove('finish');
            }
        }

        function nextStory() {
            if (isStoryTransitioning) return;
            isStoryTransitioning = true;

            if (currentStoryIndex < storiesData.length - 1) {
                updateStoryUI(currentStoryIndex + 1);
                setTimeout(() => {
                    isStoryTransitioning = false;
                }, 400);
            } else {
                closeStories();
                setTimeout(() => {
                    isStoryTransitioning = false;
                }, 400);
            }
        }

        function prevStory() {
            if (isStoryTransitioning) return;
            if (currentStoryIndex > 0) {
                isStoryTransitioning = true;
                updateStoryUI(currentStoryIndex - 1);
                setTimeout(() => {
                    isStoryTransitioning = false;
                }, 400);
            }
        }

        function closeStories() {
            const overlay = document.getElementById('storiesOverlay');
            overlay.classList.remove('active');
            isStoriesActive = false;
            
            document.getElementById('scheduleWrapper').classList.add('visible');
            document.querySelectorAll('.panel').forEach(p => p.classList.add('visible'));
        }

        // ========== РАСПИСАНИЕ ==========
        function renderSchedule(data, maps) {
            const container = document.getElementById('scheduleContainer');

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="panel" style="border-color:#e0e0e0;background:#fafafa;padding:30px;text-align:center;">
                        <div style="font-size:20px;margin-bottom:10px;">📋</div>
                        <div style="font-weight:600;color:#666;">Немає даних для відображення</div>
                    </div>
                `;
                return;
            }

            const kyivTime = getKyivTime();
            const currentTimeStr = kyivTime.toLocaleString('uk-UA', {
                timeZone: 'Europe/Kiev',
                hour: '2-digit',
                minute: '2-digit'
            });

            const timeGroups = {};
            data.forEach(row => {
                const key = `${row.timeFrom}–${row.timeTo}`;
                if (!timeGroups[key]) timeGroups[key] = [];
                timeGroups[key].push(row);
            });

            const sortedKeys = Object.keys(timeGroups).sort((a, b) => {
                return a.split('–')[0].localeCompare(b.split('–')[0]);
            });

            let html = '';

            sortedKeys.forEach((key) => {
                const rows = timeGroups[key];
                const timeFrom = key.split('–')[0];
                const timeTo = key.split('–')[1];
                const status = getStationStatus(timeFrom, timeTo, kyivTime);

                if (status === 'past') return;

                const isActive = status === 'active';
                const panelClass = isActive ? 'active' : 'next';
                const title = isActive ? 'Працюють зараз' : 'Наступні';

                const stationItems = rows.filter(r => r.station !== 'ДР');
                const eventRow = rows.find(r => r.station === 'ДР');

                html += `<section class="panel ${panelClass}" aria-label="${title}">`;
                
                // Время и заголовок в одной строке
                html += `<div class="time-row">`;
                html += `<div class="time-left">`;
                html += `<svg class="clock" viewBox="0 0 48 48" aria-hidden="true">
                            <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="4"/>
                            <path d="M24 12v13l9 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                        </svg>`;
                html += `<span>${key}</span>`;
                html += `</div>`;
                html += `<div class="time-right">${title}</div>`;
                html += `</div>`;

                html += `<div class="grid-stations">`;
                stationItems.forEach(st => {
                    const style = getStationStyle(st.station);
                    const logoHtml = st.logo ? `<img src="${st.logo}" alt="${st.station}">` : style.emoji;
                    html += `<article class="station" data-station="${st.station}">`;
                    html += `<div class="badge ${style.cls}">${logoHtml}</div>`;
                    const displayName = st.station.replace(/-/g, ' ');
                    html += `<div class="station-name">${displayName}</div>`;
                    html += `</article>`;
                });
                html += `</div>`;

                if (eventRow) {
                    const style = getStationStyle(eventRow.station);
                    const logoHtml = eventRow.logo ? `<img src="${eventRow.logo}" alt="${eventRow.station}">` : style.emoji;
                    html += `<div class="grid-stations">`;
                    html += `<article class="station wide" data-station="${eventRow.station}">`;
                    html += `<div class="badge ${style.cls}">${logoHtml}</div>`;
                    const displayName = eventRow.station.replace(/-/g, ' ');
                    html += `<div class="station-name">${displayName}<span class="station-time">${eventRow.timeFrom}-${eventRow.timeTo}</span></div>`;
                    html += `</article>`;
                    html += `</div>`;
                }

                html += `</section>`;
            });

            if (!html) {
                html = `
                    <div class="panel" style="border-color:#e0e0e0;background:#fafafa;padding:30px;text-align:center;">
                        <div style="font-size:20px;margin-bottom:10px;">⏰</div>
                        <div style="font-weight:600;color:#666;">Немає активних або майбутніх станцій</div>
                        <div style="font-size:12px;color:#999;margin-top:8px;">Поточний час: ${currentTimeStr}</div>
                    </div>
                `;
            }

            html += `<div class="update-time">🔄 Оновлено: ${currentTimeStr} (Київ)</div>`;
            container.innerHTML = html;

            document.querySelectorAll('.station').forEach(el => {
                el.addEventListener('click', function() {
                    const stationName = this.dataset.station;
                    const mapUrl = maps[stationName];
                    if (mapUrl) {
                        openMap(mapUrl);
                    }
                });
            });
        }

        // ========== МОДАЛЬНОЕ ОКНО ДЛЯ КАРТЫ ==========
        function openMap(url) {
            const modal = document.getElementById('mapModal');
            const img = document.getElementById('mapImage');
            img.src = url;
            modal.classList.add('active');
        }

        function closeMap() {
            const modal = document.getElementById('mapModal');
            modal.classList.remove('active');
            document.getElementById('mapImage').src = '';
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        async function init() {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Завантаження розкладу...</div>
                </div>
            `;

            const data = await fetchData();
            
            if (!data.success) {
                container.innerHTML = `
                    <div class="panel" style="border-color:#ffcdd2;background:#fff5f5;padding:30px;text-align:center;">
                        <div style="font-size:20px;margin-bottom:10px;">❌</div>
                        <div style="font-weight:600;color:#c62828;">Помилка: ${data.error || 'Невідома помилка'}</div>
                    </div>
                `;
                return;
            }

            settingsData = data.settings || { logos: {}, maps: {} };

            renderSchedule(data.schedule, settingsData.maps);

            if (data.stories && data.stories.length > 0) {
                renderStories(data.stories);
            } else {
                document.getElementById('scheduleWrapper').classList.add('visible');
                document.querySelectorAll('.panel').forEach(p => p.classList.add('visible'));
            }

            setInterval(async () => {
                const newData = await fetchData();
                if (newData.success) {
                    settingsData = newData.settings || { logos: {}, maps: {} };
                    renderSchedule(newData.schedule, settingsData.maps);
                }
            }, 30000);
        }

        // Обработчики событий
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('storyTapLeft').addEventListener('click', prevStory);
            document.getElementById('storyTapRight').addEventListener('click', nextStory);
            document.getElementById('storyNextBtn').addEventListener('click', nextStory);
            
            document.addEventListener('keydown', function(e) {
                if (isStoriesActive) {
                    if (e.key === 'ArrowRight' || e.key === ' ') {
                        e.preventDefault();
                        nextStory();
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        prevStory();
                    }
                }
                if (e.key === 'Escape') {
                    closeMap();
                }
            });

            let touchStartX = 0;
            const overlay = document.getElementById('storiesOverlay');
            overlay.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            overlay.addEventListener('touchend', function(e) {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 30) {
                    if (diff > 0) nextStory();
                    else prevStory();
                }
            }, { passive: true });

            document.getElementById('modalClose').addEventListener('click', closeMap);
            document.getElementById('mapModal').addEventListener('click', function(e) {
                if (e.target === this) closeMap();
            });
        });

        init();
    </script>
</body>
</html>
