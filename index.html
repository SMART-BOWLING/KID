<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Кідландія - Розклад</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background: #ffffff;
            font-family: "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", Arial, sans-serif;
            color: #101733;
            padding: 0;
            overflow-x: hidden;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: transparent;
            border-radius: 36px;
            padding: 16px 10px 30px;
            position: relative;
        }
        .cloud {
            position: absolute;
            opacity: .72;
            pointer-events: none;
        }
        .cloud-left {
            left: -10px;
            top: 140px;
            width: 76px;
            height: 39px;
            color: #fbf3cd;
        }
        .cloud-right {
            right: -6px;
            top: 130px;
            width: 82px;
            height: 42px;
            color: #e3f1fe;
        }
        .logo {
            position: relative;
            width: max-content;
            margin: 10px auto 20px;
            font-size: 38px;
            font-weight: 1000;
            letter-spacing: 1px;
            line-height: .9;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            will-change: transform;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        .logo span {
            display: inline-block;
            text-shadow: 0 2px 1px rgba(0, 0, 0, .06);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        .star {
            position: absolute;
            left: 42px;
            top: -22px;
            width: 20px;
            height: 20px;
            color: #ffc542;
            filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .12));
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        
        /* ===== СТИЛИ ДЛЯ СТОРИС ===== */
        .stories-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            touch-action: none;
            flex-direction: column;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        .stories-overlay.active {
            display: flex;
        }
        
        .stories-bg-green {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9, #a5d6a7, #81c784);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .stories-bg-green.active {
            opacity: 1;
        }
        
        .stories-bg-blue {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb, #90caf9, #64b5f6);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .stories-bg-blue.active {
            opacity: 1;
        }
        
        .story-circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 1;
        }
        .story-circle-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -80px;
        }
        .story-circle-2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            left: -60px;
        }
        .story-circle-3 {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .stories-bg-green .story-circle-1 {
            background: radial-gradient(circle, rgba(46, 135, 29, 0.12), transparent);
        }
        .stories-bg-green .story-circle-2 {
            background: radial-gradient(circle, rgba(107, 183, 47, 0.10), transparent);
        }
        .stories-bg-green .story-circle-3 {
            background: radial-gradient(circle, rgba(46, 135, 29, 0.06), transparent);
        }
        
        .stories-bg-blue .story-circle-1 {
            background: radial-gradient(circle, rgba(18, 121, 191, 0.12), transparent);
        }
        .stories-bg-blue .story-circle-2 {
            background: radial-gradient(circle, rgba(37, 138, 210, 0.10), transparent);
        }
        .stories-bg-blue .story-circle-3 {
            background: radial-gradient(circle, rgba(18, 121, 191, 0.06), transparent);
        }
        
        .story-slide {
            display: none;
            width: 100%;
            height: 100%;
            padding: 70px 30px 140px;
            color: #1a1a2e;
            text-align: center;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex: 1;
            z-index: 2;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        .story-slide.active {
            display: flex;
        }
        
        .story-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .story-slide img {
            max-width: 85%;
            max-height: 50vh;
            border-radius: 20px;
            margin-bottom: 30px;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 3px solid rgba(255,255,255,0.5);
        }
        
        .story-slide .story-text {
            font-size: 26px;
            line-height: 1.5;
            font-weight: 700;
            max-width: 90%;
            word-wrap: break-word;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            padding: 16px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        .stories-bg-green.active ~ .story-slide .story-text {
            color: #1e4a0e;
            background: rgba(255,255,255,0.9);
        }
        
        .stories-bg-blue.active ~ .story-slide .story-text {
            color: #0a2a4a;
            background: rgba(255,255,255,0.9);
        }
        
        .story-slide .story-text.large {
            font-size: 32px;
        }
        
        .story-slide .story-text .highlight-green {
            background: linear-gradient(135deg, #2e871d, #6bb72f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .story-slide .story-text .highlight-blue {
            background: linear-gradient(135deg, #1279bf, #258ad2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .story-slide .story-text .highlight-gold {
            background: linear-gradient(135deg, #ffc542, #f06a2f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .story-slide .story-text .highlight-pink {
            background: linear-gradient(135deg, #e33b85, #8038bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .story-progress {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .story-progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
            overflow: hidden;
        }
        .story-progress-bar .fill {
            height: 100%;
            width: 0%;
            transition: none;
            border-radius: 4px;
        }
        
        .stories-bg-green.active ~ .story-progress .fill {
            background: #2e871d;
        }
        .stories-bg-green.active ~ .story-progress .done .fill {
            background: #2e871d;
        }
        
        .stories-bg-blue.active ~ .story-progress .fill {
            background: #1279bf;
        }
        .stories-bg-blue.active ~ .story-progress .done .fill {
            background: #1279bf;
        }
        
        .story-progress-bar.done .fill {
            width: 100% !important;
        }
        .story-progress-bar.active .fill {
            width: 100% !important;
        }
        
        .story-tap-area {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            z-index: 5;
        }
        .story-tap-left {
            left: 0;
        }
        .story-tap-right {
            right: 0;
        }
        
        .story-next-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 16px 44px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            min-width: 140px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-shadow: 0 2px 8px rgba(0,0,0,0.1);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            backface-visibility: hidden;
            transform: translateX(-50%) translateZ(0);
        }
        .story-next-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .story-next-btn:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        .stories-bg-green.active ~ .story-next-btn {
            background: rgba(46, 135, 29, 0.7);
            border-color: rgba(46, 135, 29, 0.5);
        }
        .stories-bg-green.active ~ .story-next-btn:hover {
            background: rgba(46, 135, 29, 0.85);
        }
        .stories-bg-green.active ~ .story-next-btn.finish {
            background: linear-gradient(135deg, rgba(46, 135, 29, 0.8), rgba(107, 183, 47, 0.6));
            border-color: rgba(46, 135, 29, 0.5);
        }
        
        .stories-bg-blue.active ~ .story-next-btn {
            background: rgba(18, 121, 191, 0.7);
            border-color: rgba(18, 121, 191, 0.5);
        }
        .stories-bg-blue.active ~ .story-next-btn:hover {
            background: rgba(18, 121, 191, 0.85);
        }
        .stories-bg-blue.active ~ .story-next-btn.finish {
            background: linear-gradient(135deg, rgba(18, 121, 191, 0.8), rgba(37, 138, 210, 0.6));
            border-color: rgba(18, 121, 191, 0.5);
        }
        
        .story-next-btn.finish:hover {
            transform: translateX(-50%) scale(1.05);
        }
        
        .story-indicators {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .story-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .stories-bg-green.active ~ .story-indicators .story-dot {
            background: rgba(46, 135, 29, 0.25);
        }
        .stories-bg-green.active ~ .story-indicators .story-dot.active {
            background: #2e871d;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(46, 135, 29, 0.3);
        }
        .stories-bg-green.active ~ .story-indicators .story-dot.done {
            background: rgba(46, 135, 29, 0.6);
        }
        
        .stories-bg-blue.active ~ .story-indicators .story-dot {
            background: rgba(18, 121, 191, 0.25);
        }
        .stories-bg-blue.active ~ .story-indicators .story-dot.active {
            background: #1279bf;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(18, 121, 191, 0.3);
        }
        .stories-bg-blue.active ~ .story-indicators .story-dot.done {
            background: rgba(18, 121, 191, 0.6);
        }
        
        .story-counter {
            position: absolute;
            top: 22px;
            right: 22px;
            z-index: 10;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
        }
        .stories-bg-green.active ~ .story-counter {
            color: #1e4a0e;
            background: rgba(255,255,255,0.7);
        }
        .stories-bg-blue.active ~ .story-counter {
            color: #0a2a4a;
            background: rgba(255,255,255,0.7);
        }
        
        /* ===== СТИЛИ ДЛЯ РАСПИСАНИЯ ===== */
        .schedule-wrapper {
            display: none;
        }
        .schedule-wrapper.visible {
            display: block;
        }
        .panel {
            border: 1.5px solid;
            border-radius: 20px;
            padding: 16px 10px 16px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(35, 65, 104, .08);
        }
        .panel+.panel {
            margin-top: 12px;
        }
        .panel.active {
            background: #f5fadf;
            border-color: #e0ecad;
        }
        .panel.next {
            background: #edf7ff;
            border-color: #c8e4f7;
            padding: 16px 8px 16px;
        }
        
        .time-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 12px;
            gap: 10px;
        }
        .time-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 1000;
            line-height: 1;
        }
        .time-right {
            font-size: 16px;
            font-weight: 1000;
            letter-spacing: .2px;
            text-transform: uppercase;
            line-height: 1;
        }
        
        .active .time-left,
        .active .time-right {
            color: #2e871d;
        }
        .next .time-left,
        .next .time-right {
            color: #1279bf;
        }
        
        .clock {
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
        }
        
        .grid-stations {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
        }
        .grid-stations .wide {
            grid-column: 1 / -1;
        }
        .station {
            display: grid;
            place-items: center;
            min-width: 0;
            background: #ffffff;
            border: 1.5px solid rgba(183, 205, 141, .48);
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(35, 65, 104, .05);
            min-height: 100px;
            height: auto;
            padding: 8px 3px 9px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .station:active {
            transform: scale(0.95);
        }
        .station.wide {
            grid-column: 1 / -1;
            min-height: 70px;
            height: auto;
            display: flex;
            justify-content: flex-start;
            gap: 18px;
            padding: 8px 20px;
            border-color: rgba(174, 210, 235, .7);
        }
        .badge {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: 6px;
            font-size: 32px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .wide .badge {
            width: 56px;
            height: 56px;
            margin: 0;
            flex: 0 0 auto;
            font-size: 34px;
        }
        .badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .station-name {
            max-width: 100%;
            color: #101733;
            font-size: 10px;
            font-weight: 1000;
            line-height: 1.2;
            text-align: center;
            text-transform: uppercase;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: none;
            padding: 0 1px;
            width: 100%;
        }
        .station-name br {
            display: none;
        }
        .wide .station-name {
            color: #7a32bf;
            font-size: 17px;
            line-height: 1.2;
            text-align: left;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: none;
        }
        .station-time {
            display: block;
            margin-top: 6px;
            color: #7a32bf;
            font-size: 12px;
            font-weight: 1000;
        }
        .badge-default {
            background: #f0f0f0;
        }
        .badge-default-2 {
            background: #e8f0fe;
        }
        .badge-default-3 {
            background: #fce8e8;
        }
        .badge-default-4 {
            background: #e8fce8;
        }
        .loading-state {
            text-align: center;
            padding: 30px 15px;
            color: #a2a2a2;
            font-size: 16px;
            font-weight: 600;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 34px;
            height: 34px;
            border: 4px solid #e0ecad;
            border-top-color: #2e871d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .update-time {
            text-align: center;
            color: #a2a2a2;
            font-size: 10px;
            margin-top: 12px;
            opacity: 0.7;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 20px;
            position: relative;
        }
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 12px;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            border: none;
            font-size: 22px;
            cursor: pointer;
            display: grid;
            place-items: center;
            color: #333;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: rgba(0,0,0,0.2);
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 12px 6px 24px;
                border-radius: 24px;
            }
            .logo {
                font-size: 32px;
                margin: 8px auto 16px;
            }
            .star {
                left: 36px;
                top: -18px;
                width: 18px;
                height: 18px;
            }
            .time-left {
                font-size: 24px;
                gap: 8px;
            }
            .time-right {
                font-size: 14px;
            }
            .clock {
                width: 28px;
                height: 28px;
            }
            .time-row {
                margin: 0 0 10px;
                gap: 8px;
            }
            .panel {
                padding: 12px 6px 12px;
                border-radius: 16px;
            }
            .panel.next {
                padding: 12px 5px 12px;
            }
            .station {
                min-height: 85px;
                padding: 6px 2px 7px;
                border-radius: 12px;
            }
            .station-name {
                font-size: 9px;
            }
            .wide .station-name {
                font-size: 14px;
            }
            .badge {
                width: 50px;
                height: 50px;
                font-size: 26px;
                margin-bottom: 5px;
            }
            .wide .badge {
                width: 48px;
                height: 48px;
                font-size: 28px;
            }
            .station.wide {
                padding: 6px 14px;
                gap: 14px;
                min-height: 60px;
            }
            .grid-stations {
                gap: 4px;
            }
            .station-time {
                font-size: 11px;
                margin-top: 4px;
            }
            .story-slide {
                padding: 60px 20px 120px;
            }
            .story-slide .story-text {
                font-size: 20px;
                padding: 14px 20px;
            }
            .story-slide .story-text.large {
                font-size: 24px;
            }
            .story-slide img {
                max-height: 45vh;
                margin-bottom: 24px;
            }
            .story-next-btn {
                padding: 14px 32px;
                font-size: 16px;
                bottom: 30px;
                min-width: 110px;
            }
            .story-indicators {
                bottom: 90px;
                gap: 10px;
            }
            .story-dot {
                width: 8px;
                height: 8px;
            }
            .story-counter {
                font-size: 12px;
                padding: 4px 12px;
                top: 18px;
                right: 18px;
            }
            .story-progress {
                top: 12px;
                left: 12px;
                right: 12px;
                gap: 4px;
            }
            .story-circle-1 {
                width: 200px;
                height: 200px;
                top: -80px;
                right: -60px;
            }
            .story-circle-2 {
                width: 150px;
                height: 150px;
                bottom: -40px;
                left: -40px;
            }
            .story-circle-3 {
                width: 100px;
                height: 100px;
            }
        }
        @media (max-width: 380px) {
            .container {
                padding: 10px 4px 20px;
            }
            .logo {
                font-size: 28px;
                margin: 6px auto 14px;
            }
            .star {
                left: 32px;
                top: -16px;
                width: 16px;
                height: 16px;
            }
            .time-left {
                font-size: 20px;
                gap: 6px;
            }
            .time-right {
                font-size: 12px;
            }
            .clock {
                width: 24px;
                height: 24px;
            }
            .time-row {
                margin: 0 0 8px;
                gap: 6px;
            }
            .panel {
                padding: 10px 4px 10px;
                border-radius: 14px;
            }
            .panel.next {
                padding: 10px 4px 10px;
            }
            .station {
                min-height: 70px;
                padding: 5px 2px 6px;
                border-radius: 10px;
            }
            .station-name {
                font-size: 8px;
            }

<body>

    <div class="container" id="mainContainer">

            <path fill="currentColor" d="M16 38h64c8 0 14-6 14-13s-6-13-14-13c-2 0-4 1-6 1C70 5 62 0 52 0 40 0 31 7 28 18c-3-2-7-3-11-3C8 15 1 22 1 31s7 7 15 7z"/>

        <h1 class="logo" aria-label="Кідландія" id="mainLogo">

            <span style="color:#7b2fc0">К</span><span style="color:#f06a2f">і</span><span style="color:#6bb72f">д</span><span style="color:#ffc928">л</span><span style="color:#258ad2">а</span><span style="color:#e33b85">н</span><span style="color:#8038bd">д</span><span style="color:#eb3c73">і</span><span style="color:#50bec3">я</span>
        </h1>

        <!-- Контейнер для динамического контента -->
        <div id="dynamicContent">
            <div id="scheduleWrapper" class="schedule-wrapper">

    <!-- Полноэкранные сторис - вне основного контейнера -->
    <div class="stories-overlay" id="storiesOverlay">
        <div class="stories-bg-green" id="bgGreen">

        <div class="stories-bg-blue" id="bgBlue">

    <!-- Модальное окно для карты -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <img id="mapImage" src="" alt="Карта станції">
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzeEhyXLvNNsXUCTiKTo4GSuuTj4NEmAXopQ0ztwk3HjqLB9BXTqYNuGVlEdNw6LJo-sA/exec';

        const REFRESH_INTERVAL_MS = 30000;
        const STORY_TRANSITION_MS = 280;

        let storiesData = [];
        let currentStoryIndex = 0;
        let settingsData = { logos: {}, maps: {} };
        let isStoriesActive = false;
        let isStoryTransitioning = false;
        let scheduleDataCache = [];
        let mapsCache = {};
        let refreshTimer = null;

        async function fetchData() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000);

            try {
                const url = new URL(SCRIPT_URL);
                url.searchParams.set('_', Date.now().toString());

                const response = await fetch(url.toString(), {
                    method: 'GET',
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                return data && typeof data === 'object'
                    ? data
                    : { success: false, error: 'Некоректна відповідь сервера' };
            } catch (err) {
                const message = err.name === 'AbortError'
                    ? 'Сервер не відповів вчасно'
                    : (err.message || 'Помилка завантаження');

                console.error('Помилка завантаження:', err);
                return { success: false, error: message };
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function getKyivParts() {
            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Europe/Kyiv',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(new Date());

            return Object.fromEntries(
                parts
                    .filter(part => part.type !== 'literal')
                    .map(part => [part.type, Number(part.value)])
            );
        }

        function getKyivMinutes() {
            const { hour = 0, minute = 0 } = getKyivParts();
            return hour * 60 + minute;
        }

        function getKyivTimeString() {
            return new Intl.DateTimeFormat('uk-UA', {
                timeZone: 'Europe/Kyiv',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            }).format(new Date());
        }

        function normalizeTime(value) {
            if (value == null) return '';
            const match = String(value).trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
            if (!match) return '';

            const hours = Number(match[1]);
            const minutes = Number(match[2]);

            if (hours > 23 || minutes > 59) return '';

            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        function parseTimeToMinutes(timeStr) {
            const normalized = normalizeTime(timeStr);
            if (!normalized) return -1;

            const [hours, minutes] = normalized.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function getStationStatus(timeFrom, timeTo, currentMinutes) {
            const from = parseTimeToMinutes(timeFrom);
            const to = parseTimeToMinutes(timeTo);

            if (from === -1 || to === -1) return 'unknown';

            if (from === to) return 'active';

            if (to < from) {
                return (currentMinutes >= from || currentMinutes < to) ? 'active' : 'future';
            }

            if (currentMinutes >= from && currentMinutes < to) return 'active';
            if (currentMinutes < from) return 'future';
            return 'past';
        }

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function sanitizeImageUrl(value) {
            if (!value) return '';

            try {
                const url = new URL(String(value), window.location.href);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
            } catch {
                return '';
            }
        }

        function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightStoryText(value) {
            let result = escapeHTML(value);

            const highlights = [
                ['Кідландія', 'highlight-gold'],
                ['Kidslandia', 'highlight-gold'],
                ['дітей', 'highlight-green'],
                ['дитини', 'highlight-green'],
                ['дитина', 'highlight-green'],
                ['діти', 'highlight-green'],
                ['свято', 'highlight-pink'],
                ['розваги', 'highlight-blue'],
                ['веселощі', 'highlight-gold']
            ];

            highlights.forEach(([word, className]) => {
                const re = new RegExp(`(${escapeRegExp(word)})`, 'giu');
                result = result.replace(re, `<span class="${className}">$1</span>`);
            });

            return result.replace(/\n/g, '<br>');
        }

        function getStationStyle(stationName) {
            const name = stationName.toUpperCase();
            const map = {
                'КАРАОКЕ': { emoji: '🎤', cls: 'mic' },
                'СТРОЙМАЙДАНЧИК': { emoji: '🧱', cls: 'build' },
                'ТЕАТР': { emoji: '🎭', cls: 'theatre' },
                'ДОСТАВКА СИЛЬПО': { emoji: '🛒', cls: 'silpo' },
                'СИЛЬПО': { emoji: '🛒', cls: 'silpo' },
                'TV-СТУДІЯ': { emoji: '📺', cls: 'tv' },
                'EVA': { emoji: '🛍️', cls: 'eva' },
                'ЕВА': { emoji: '🛍️', cls: 'eva' },
                'ТУРИСТИЧНЕ АГЕНСТВО': { emoji: '🌍🧳', cls: 'trip' },
                'ЛІТАК': { emoji: '✈️', cls: 'plane' },
                'ДР': { emoji: '🎂', cls: 'dr' }
            };

            for (const [key, value] of Object.entries(map)) {
                if (name === key) {
                    return value;
                }
            }

            const defaultClasses = ['badge-default', 'badge-default-2', 'badge-default-3', 'badge-default-4'];
            const hash = name.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return {
                emoji: name.charAt(0),
                cls: defaultClasses[hash % defaultClasses.length]
            };
        }

        // ========== СТОРИС ==========
        function renderStories(stories) {
            const overlay = document.getElementById('storiesOverlay');
            const slidesContainer = document.getElementById('storySlides');
            const progressContainer = document.getElementById('storyProgress');
            const indicatorsContainer = document.getElementById('storyIndicators');
            const counter = document.getElementById('storyCounter');

            if (!stories || stories.length === 0) {
                overlay.classList.remove('active');
                return;
            }

            storiesData = stories;
            overlay.classList.add('active');
            document.body.classList.add('stories-open');
            isStoriesActive = true;

            document.getElementById('scheduleWrapper').classList.remove('visible');

            slidesContainer.innerHTML = '';
            stories.forEach((story, index) => {
                const slide = document.createElement('div');
                slide.className = 'story-slide' + (index === 0 ? ' active' : '');
                slide.dataset.index = index;
                
                const content = document.createElement('div');
                content.className = 'story-content';
                
                if (story.image) {
                    const img = document.createElement('img');
                    img.src = story.image;
                    img.alt = 'Сторис';
                    img.loading = 'lazy';
                    content.appendChild(img);
                }
                
                if (story.text) {
                    const text = document.createElement('div');
                    text.className = 'story-text' + (story.text.length < 40 ? ' large' : '');
                    let formattedText = story.text;
                    const highlights = [
                        { find: /Кідландія/gi, replace: '<span class="highlight-gold">Кідландія</span>' },
                        { find: /Kidslandia/gi, replace: '<span class="highlight-gold">Kidslandia</span>' },
                        { find: /діти/gi, replace: '<span class="highlight-green">діти</span>' },
                        { find: /дітей/gi, replace: '<span class="highlight-green">дітей</span>' },
                        { find: /дитина/gi, replace: '<span class="highlight-green">дитина</span>' },
                        { find: /дитини/gi, replace: '<span class="highlight-green">дитини</span>' },
                        { find: /свято/gi, replace: '<span class="highlight-pink">свято</span>' },
                        { find: /розваги/gi, replace: '<span class="highlight-blue">розваги</span>' },
                        { find: /веселощі/gi, replace: '<span class="highlight-gold">веселощі</span>' }
                    ];
                    highlights.forEach(h => {
                        formattedText = formattedText.replace(h.find, h.replace);
                    });
                    text.innerHTML = formattedText;
                    content.appendChild(text);
                }
                
                slide.appendChild(content);
                slidesContainer.appendChild(slide);
            });

            progressContainer.innerHTML = '';
            stories.forEach((_, index) => {
                const bar = document.createElement('div');
                bar.className = 'story-progress-bar';
                bar.innerHTML = '<div class="fill"></div>';
                progressContainer.appendChild(bar);
            });

            indicatorsContainer.innerHTML = '';
            stories.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = 'story-dot';
                indicatorsContainer.appendChild(dot);
            });

            counter.textContent = `1/${stories.length}`;

            currentStoryIndex = 0;
            updateStoryUI(0);
            updateButtonText();
        }

        function updateStoryUI(index) {
            const slides = document.querySelectorAll('.story-slide');
            const bars = document.querySelectorAll('.story-progress-bar');
            const dots = document.querySelectorAll('.story-dot');
            const counter = document.getElementById('storyCounter');
            
            const bgGreen = document.getElementById('bgGreen');
            const bgBlue = document.getElementById('bgBlue');
            
            if (index % 2 === 0) {
                bgGreen.classList.add('active');
                bgBlue.classList.remove('active');
            } else {
                bgBlue.classList.add('active');
                bgGreen.classList.remove('active');
            }

            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });

            bars.forEach((bar, i) => {
                bar.classList.remove('active', 'done');
                const fill = bar.querySelector('.fill');
                if (i < index) {
                    bar.classList.add('done');
                    fill.style.width = '100%';
                } else if (i === index) {
                    bar.classList.add('active');
                    fill.style.width = '100%';
                } else {
                    fill.style.width = '0%';
                }
            });

            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'done');
                if (i < index) dot.classList.add('done');
                else if (i === index) dot.classList.add('active');
            });

            counter.textContent = `${index + 1}/${storiesData.length}`;
            currentStoryIndex = index;
            updateButtonText();
        }

        function updateButtonText() {
            const btn = document.getElementById('storyNextBtn');
            const btnText = document.getElementById('btnText');
            if (currentStoryIndex === storiesData.length - 1) {
                btnText.textContent = 'ДО РОЗКЛАДУ';
                btn.classList.add('finish');
            } else {
                btnText.textContent = 'ДАЛІ';
                btn.classList.remove('finish');
            }
        }

        function nextStory() {
            if (isStoryTransitioning) return;
            isStoryTransitioning = true;

            if (currentStoryIndex < storiesData.length - 1) {
                // Просто обновляем UI без перезагрузки DOM
                updateStoryUI(currentStoryIndex + 1);
                setTimeout(() => {
                    isStoryTransitioning = false;
                }, STORY_TRANSITION_MS);
            } else {
                closeStories();
                setTimeout(() => {
                    isStoryTransitioning = false;
                }, STORY_TRANSITION_MS);
            }
        }

        function prevStory() {
            if (isStoryTransitioning) return;
            if (currentStoryIndex > 0) {
                isStoryTransitioning = true;
                updateStoryUI(currentStoryIndex - 1);
                setTimeout(() => {
                    isStoryTransitioning = false;
                }, STORY_TRANSITION_MS);
            }
        }

        function closeStories() {
            const overlay = document.getElementById('storiesOverlay');
            overlay.classList.remove('active');
            isStoriesActive = false;
            
            document.getElementById('scheduleWrapper').classList.add('visible');
            document.querySelectorAll('.panel').forEach(p => p.classList.add('visible'));
        }

        // ========== РАСПИСАНИЕ ==========
        function generateScheduleHTML(data) {
            if (!Array.isArray(data) || data.length === 0) {
                return `
                    <div class="panel" style="border-color:#e0e0e0;background:#fafafa;padding:30px;text-align:center;">
                        <div style="font-size:20px;margin-bottom:10px;">📋</div>
                        <div style="font-weight:600;color:#666;">Немає даних для відображення</div>
                    </div>
                `;
            }

            const currentMinutes = getKyivMinutes();
            const currentTimeStr = getKyivTimeString();
            const timeGroups = new Map();

            data.forEach(rawRow => {
                if (!rawRow || typeof rawRow !== 'object') return;

                const timeFrom = normalizeTime(rawRow.timeFrom);
                const timeTo = normalizeTime(rawRow.timeTo);
                const station = String(rawRow.station ?? '').trim();

                if (!timeFrom || !timeTo || !station) return;

                const key = `${timeFrom}–${timeTo}`;

                if (!timeGroups.has(key)) timeGroups.set(key, []);
                timeGroups.get(key).push({ ...rawRow, timeFrom, timeTo, station });
            });

            const sortedEntries = [...timeGroups.entries()].sort((a, b) => {
                return parseTimeToMinutes(a[0].split('–')[0]) -
                       parseTimeToMinutes(b[0].split('–')[0]);
            });

            const activeEntries = [];
            const futureEntries = [];

            sortedEntries.forEach(([key, rows]) => {
                const [timeFrom, timeTo] = key.split('–');
                const status = getStationStatus(timeFrom, timeTo, currentMinutes);

                if (status === 'active') activeEntries.push([key, rows]);
                if (status === 'future') futureEntries.push([key, rows]);
            });

            // Активні блоки + лише найближчий наступний.
            const entriesToRender = [
                ...activeEntries.map(entry => ({ entry, isActive: true })),
                ...futureEntries.slice(0, 1).map(entry => ({ entry, isActive: false }))
            ];

            let html = '';

            entriesToRender.forEach(({ entry, isActive }) => {
                const [key, rows] = entry;
                const title = isActive ? 'Працюють зараз' : 'Наступні';
                const panelClass = isActive ? 'active' : 'next';

                const stationItems = rows.filter(r => r.station.toUpperCase() !== 'ДР');
                const eventRows = rows.filter(r => r.station.toUpperCase() === 'ДР');

                html += `<section class="panel ${panelClass}" aria-label="${escapeHTML(title)}">`;

                html += `
                    <div class="time-row">
                        <div class="time-left">
                            <svg class="clock" viewBox="0 0 48 48" aria-hidden="true">
                                <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="4"/>
                                <path d="M24 12v13l9 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                            </svg>
                            <span>${escapeHTML(key)}</span>
                        </div>
                        <div class="time-right">${escapeHTML(title)}</div>
                    </div>
                `;

                if (stationItems.length) {
                    html += `<div class="grid-stations">`;

                    stationItems.forEach(st => {
                        const style = getStationStyle(st.station);
                        const stationName = String(st.station);
                        const displayName = stationName.replace(/-/g, ' ');
                        const logoUrl = sanitizeImageUrl(st.logo);
                        const hasMap = Boolean(sanitizeImageUrl(mapsCache[stationName]));

                        const logoHtml = logoUrl
                            ? `<img src="${escapeHTML(logoUrl)}" alt="" loading="lazy" decoding="async">`
                            : escapeHTML(style.emoji);

                        html += `
                            <article
                                class="station"
                                data-station="${escapeHTML(stationName)}"
                                role="${hasMap ? 'button' : 'group'}"
                                tabindex="${hasMap ? '0' : '-1'}"
                                aria-disabled="${hasMap ? 'false' : 'true'}"
                            >
                                <div class="badge ${escapeHTML(style.cls)}">${logoHtml}</div>
                                <div class="station-name">${escapeHTML(displayName)}</div>
                            </article>
                        `;
                    });

                    html += `</div>`;
                }

                eventRows.forEach(eventRow => {
                    const style = getStationStyle(eventRow.station);
                    const stationName = String(eventRow.station);
                    const displayName = stationName.replace(/-/g, ' ');
                    const logoUrl = sanitizeImageUrl(eventRow.logo);
                    const hasMap = Boolean(sanitizeImageUrl(mapsCache[stationName]));

                    const logoHtml = logoUrl
                        ? `<img src="${escapeHTML(logoUrl)}" alt="" loading="lazy" decoding="async">`
                        : escapeHTML(style.emoji);

                    html += `
                        <div class="grid-stations">
                            <article
                                class="station wide"
                                data-station="${escapeHTML(stationName)}"
                                role="${hasMap ? 'button' : 'group'}"
                                tabindex="${hasMap ? '0' : '-1'}"
                                aria-disabled="${hasMap ? 'false' : 'true'}"
                            >
                                <div class="badge ${escapeHTML(style.cls)}">${logoHtml}</div>
                                <div class="station-name">
                                    ${escapeHTML(displayName)}
                                    <span class="station-time">${escapeHTML(eventRow.timeFrom)}–${escapeHTML(eventRow.timeTo)}</span>
                                </div>
                            </article>
                        </div>
                    `;
                });

                html += `</section>`;
            });

            if (!html) {
                html = `
                    <div class="panel" style="border-color:#e0e0e0;background:#fafafa;padding:30px;text-align:center;">
                        <div style="font-size:20px;margin-bottom:10px;">⏰</div>
                        <div style="font-weight:600;color:#666;">Станції на сьогодні вже завершили роботу</div>
                        <div style="font-size:12px;color:#999;margin-top:8px;">Поточний час: ${escapeHTML(currentTimeStr)}</div>
                    </div>
                `;
            }

            html += `<div class="update-time">🔄 Оновлено: ${escapeHTML(currentTimeStr)} (Київ)</div>`;
            return html;
        }

        function renderSchedule(data, maps) {
            mapsCache = maps && typeof maps === 'object' ? maps : {};

            const container = document.getElementById('scheduleContainer');
            container.innerHTML = generateScheduleHTML(data);

            container.querySelectorAll('.station').forEach(el => {
                const openStationMap = () => {
                    const stationName = el.dataset.station;
                    const mapUrl = sanitizeImageUrl(mapsCache[stationName]);

                    if (mapUrl) openMap(mapUrl);
                };

                el.addEventListener('click', openStationMap);
                el.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openStationMap();
                    }
                });
            });
        }

        // ========== МОДАЛЬНОЕ ОКНО ДЛЯ КАРТЫ ==========
        function openMap(url) {
            const safeUrl = sanitizeImageUrl(url);
            if (!safeUrl) return;

            const modal = document.getElementById('mapModal');
            const img = document.getElementById('mapImage');

            img.src = safeUrl;
            modal.classList.add('active');
            document.body.classList.add('modal-open');
            document.getElementById('modalClose').focus();
        }

        function closeMap() {
            const modal = document.getElementById('mapModal');
            if (!modal.classList.contains('active')) return;

            modal.classList.remove('active');
            document.body.classList.remove('modal-open');
            document.getElementById('mapImage').src = '';
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        async function refreshSchedule({ initial = false } = {}) {
            const data = await fetchData();

            if (!data.success) {
                if (initial && scheduleDataCache.length === 0) {
                    const container = document.getElementById('scheduleContainer');
                    container.innerHTML = `
                        <div class="panel" style="border-color:#ffcdd2;background:#fff5f5;padding:30px;text-align:center;">
                            <div style="font-size:20px;margin-bottom:10px;">⚠️</div>
                            <div style="font-weight:600;color:#c62828;">Не вдалося завантажити розклад</div>
                            <div style="font-size:12px;color:#9e4040;margin-top:8px;">${escapeHTML(data.error || 'Невідома помилка')}</div>
                        </div>
                    `;
                    document.getElementById('scheduleWrapper').classList.add('visible');
                }

                return false;
            }

            settingsData = data.settings && typeof data.settings === 'object'
                ? data.settings
                : { logos: {}, maps: {} };

            mapsCache = settingsData.maps && typeof settingsData.maps === 'object'
                ? settingsData.maps
                : {};

            scheduleDataCache = Array.isArray(data.schedule) ? data.schedule : [];

            renderSchedule(scheduleDataCache, mapsCache);

            if (initial) {
                if (Array.isArray(data.stories) && data.stories.length > 0) {
                    renderStories(data.stories);
                } else {
                    document.getElementById('scheduleWrapper').classList.add('visible');
                }
            }

            return true;
        }

        async function init() {
            const container = document.getElementById('scheduleContainer');

            container.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div>Завантаження розкладу...</div>
                </div>
            `;

            await refreshSchedule({ initial: true });

            clearInterval(refreshTimer);
            refreshTimer = setInterval(() => {
                if (!document.hidden) refreshSchedule();
            }, REFRESH_INTERVAL_MS);
        }

        // Обработчики событий
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('storyTapLeft').addEventListener('click', prevStory);
            document.getElementById('storyTapRight').addEventListener('click', nextStory);
            document.getElementById('storyNextBtn').addEventListener('click', nextStory);
            
            document.addEventListener('keydown', function(e) {
                if (isStoriesActive) {
                    if (e.key === 'ArrowRight' || e.key === ' ') {
                        e.preventDefault();
                        nextStory();
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        prevStory();
                    }
                }

                if (e.key === 'Escape') {
                    if (document.getElementById('mapModal').classList.contains('active')) {
                        closeMap();
                    } else if (isStoriesActive) {
                        closeStories();
                    }
                }
            });

            let touchStartX = 0;
            const overlay = document.getElementById('storiesOverlay');
            overlay.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            overlay.addEventListener('touchend', function(e) {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 45) {
                    if (diff > 0) nextStory();
                    else prevStory();
                }
            }, { passive: true });

            document.getElementById('modalClose').addEventListener('click', closeMap);
            document.getElementById('mapModal').addEventListener('click', function(e) {
                if (e.target === this) closeMap();
            });

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && scheduleDataCache.length) {
                    renderSchedule(scheduleDataCache, mapsCache);
                    refreshSchedule();
                }
            });

            window.addEventListener('pageshow', function() {
                if (scheduleDataCache.length) {
                    renderSchedule(scheduleDataCache, mapsCache);
                }
            });
        });

        init();
    </script>
</body>
</html>
